<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- The parlour wallpaper: paw prints, half-dropped.

       GEOMETRY ONLY, for the same reason as brick.svg — black at low alpha, so the wallpaper
       takes its colour from background-color in rooms.css.

       Two paws per tile rather than one, set on opposite diagonals. One paw per tile lines up
       into obvious rows and columns the moment it repeats; offsetting the second by half the
       tile in both directions breaks the grid and it reads as a pattern instead of a table.

       They are turned a few degrees in opposite directions on purpose. A cat does not walk in
       straight lines and neither should its prints. -->

  <g fill="#000000" fill-opacity="0.075">
    <g transform="translate(26 28) rotate(-11)">
      <ellipse cx="0" cy="5" rx="9" ry="7" />
      <circle cx="-9" cy="-3.5" r="3" />
      <circle cx="-3.2" cy="-8.5" r="3.3" />
      <circle cx="3.2" cy="-8.5" r="3.3" />
      <circle cx="9" cy="-3.5" r="3" />
    </g>

    <g transform="translate(74 76) rotate(13)">
      <ellipse cx="0" cy="5" rx="9" ry="7" />
      <circle cx="-9" cy="-3.5" r="3" />
      <circle cx="-3.2" cy="-8.5" r="3.3" />
      <circle cx="3.2" cy="-8.5" r="3.3" />
      <circle cx="9" cy="-3.5" r="3" />
    </g>
  </g>
</svg>
